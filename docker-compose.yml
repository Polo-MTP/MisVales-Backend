# Ambiente de DESARROLLO. Código montado por volumen (cambios se reflejan sin rebuild),
# APP_DEBUG=true, base de datos propia en contenedor separada de cualquier MySQL local.
#
# Uso:
#   docker compose build
#   docker compose up -d
#   docker compose run --rm app composer install
#   docker compose run --rm app php artisan key:generate
#   docker compose run --rm app php artisan migrate --seed
#   → http://localhost:8080
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: misvales-app-dev
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: misvales_dev
      DB_USERNAME: misvales
      DB_PASSWORD: secret
      CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://localhost:3000,http://localhost:5173"
    depends_on:
      - mysql
    networks:
      - misvales-dev

  nginx:
    image: nginx:stable-alpine
    container_name: misvales-nginx-dev
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/public
      - ./storage:/var/www/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - misvales-dev

  # Base de datos propia de este ambiente: expuesta en el puerto 3307 del host (no 3306)
  # para no chocar con un MySQL local que ya tengas corriendo fuera de Docker.
  mysql:
    image: mysql:8.0
    container_name: misvales-mysql-dev
    environment:
      MYSQL_DATABASE: misvales_dev
      MYSQL_USER: misvales
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - misvales-mysql-dev-data:/var/lib/mysql
    networks:
      - misvales-dev

volumes:
  misvales-mysql-dev-data:

networks:
  misvales-dev:
