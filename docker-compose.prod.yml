# Ambiente de PRODUCCIÓN. Código copiado a la imagen en build time (inmutable, sin
# volumen de código), APP_DEBUG=false, dependencias sin --dev, OPcache activo.
#
# Uso:
#   cp .env.production.example .env.production
#   php artisan key:generate --show   # imprime una llave sin escribir ningún .env; pégala
#                                      # en APP_KEY= dentro de .env.production
#   # editar el resto de .env.production: APP_URL, DB_PASSWORD, DB_ROOT_PASSWORD,
#   # CORS_ALLOWED_ORIGINS, MAIL_*...
#   docker compose -f docker-compose.prod.yml --env-file .env.production build
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#   docker compose -f docker-compose.prod.yml exec app php artisan migrate --force
#   → http://localhost:8081
#
# Puertos distintos a docker-compose.yml (8080/3307) a propósito: para poder tener
# ambos ambientes corriendo al mismo tiempo en la misma máquina durante una revisión.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: misvales-app-prod
    working_dir: /var/www
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-MisVales}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?corre "php artisan key:generate --show" fuera de Docker (no escribe .env, solo imprime la llave) y pégala aquí}
      APP_URL: ${APP_URL:?debes definir el dominio real en .env.production}
      FRONTEND_URL: ${FRONTEND_URL:?debes definir el dominio real del frontend en .env.production}
      APP_LOCALE: ${APP_LOCALE:-es}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-es}
      LOG_LEVEL: ${LOG_LEVEL:-error}
      # Vacíos por default para poder probar este build localmente sin un balanceador/VPN
      # real delante. En el droplet real detrás del balanceador, TRUSTED_PROXIES si es
      # obligatorio (ver nota en .env.production.example) — el :?required intencionalmente
      # no está aquí para no bloquear pruebas locales del build de producción.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      VPN_HOST: ${VPN_HOST:-}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-misvales_prod}
      DB_USERNAME: ${DB_USERNAME:-misvales}
      DB_PASSWORD: ${DB_PASSWORD:?debes definir DB_PASSWORD en .env.production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?debes definir el dominio real del frontend en .env.production}
      # Vacío por default para no bloquear el build antes de tener las llaves de Google
      # reCAPTCHA. OJO: mientras esté vacío, cualquier login/reset/MFA con reCAPTCHA real
      # (no 'bypass-recaptcha', que solo funciona en local/testing) fallará siempre, porque
      # Google rechaza la verificación con secret vacío.
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      # Vacío por default: sin ella, las direcciones simplemente no obtienen latitud/longitud
      # (GeocodingService lo maneja como no-op), no bloquea nada más del build ni del flujo.
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      # Requerida solo si MAIL_MAILER=resend. Sin ella, Mail::send() lanza excepción y
      # MfaService devuelve 500 al intentar enviar el código del tercer factor por correo
      # (afecta a los roles con factor_count=3: Gerente de Sucursal, Gerente General, Administrador).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${APP_NAME:-MisVales}
    volumes:
      # storage/ y bootstrap/cache/ sí necesitan persistir (logs, cache de config,
      # archivos subidos) aunque el resto del código venga horneado en la imagen.
      - misvales-storage-prod:/var/www/storage
    depends_on:
      - mysql
    networks:
      - misvales-prod

  nginx:
    image: nginx:stable-alpine
    container_name: misvales-nginx-prod
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - misvales-prod

  mysql:
    image: mysql:8.0
    container_name: misvales-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-misvales_prod}
      MYSQL_USER: ${DB_USERNAME:-misvales}
      MYSQL_PASSWORD: ${DB_PASSWORD:?debes definir DB_PASSWORD en .env.production}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?debes definir DB_ROOT_PASSWORD en .env.production}
    ports:
      - "3308:3306"
    volumes:
      - misvales-mysql-prod-data:/var/lib/mysql
    networks:
      - misvales-prod

volumes:
  misvales-mysql-prod-data:
  misvales-storage-prod:

networks:
  misvales-prod:
