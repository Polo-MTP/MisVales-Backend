upload_max_filesize = 40M
post_max_size = 40M
memory_limit = 256M
max_execution_time = 60

; Nunca anunciar la versión de PHP ni mostrar errores directo al cliente en producción
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; OPcache: código inmutable en producción (no se edita dentro del contenedor), así que
; podemos saltarnos el chequeo de timestamps en cada request para ganar rendimiento.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 128
