server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Archivos subidos (evidencias, contratos): en producción NO viven bajo ./public (esa
    # carpeta viene horneada en la imagen, de solo lectura) sino en el volumen con nombre
    # misvales-storage-prod, montado solo en el contenedor 'app'. El symlink clásico de
    # Laravel (public/storage -> storage/app/public) no sirve aquí porque nginx nunca ve
    # el filesystem del contenedor app — por eso se alía directo al volumen (también
    # montado en este contenedor nginx, ver docker-compose.prod.yml) en vez de depender
    # del symlink.
    location /storage/ {
        alias /var/www/storage/app/public/;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}
